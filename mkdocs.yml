# ============================================================================
# Configuración de MkDocs / TechDocs — Users Service
# ============================================================================
# TechDocs renderiza este mkdocs.yml en Backstage usando el tema Material for MkDocs.
# Toda la documentación bajo docs/ se publica automáticamente.
#
# Referencia: https://backstage.io/docs/features/techdocs/
#             https://squidfunk.github.io/mkdocs-material/
# ============================================================================

site_name: Users Service
site_description: >-
  Servicio de Gestión de Usuarios para la Plataforma Interna de Desarrollo.
  Ciclo de vida completo del usuario — CRUD de perfiles, asignación de roles e
  integración basada en eventos con el Servicio de Autenticación.
site_author: Equipo de Ingeniería de Plataforma

repo_name: platform/users-service
repo_url: https://dev.azure.com/platform/_git/users-service
edit_uri: edit/main/docs/

# ---------------------------------------------------------------------------
# Tema — Material for MkDocs
# ---------------------------------------------------------------------------
theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/git-alt
  favicon: assets/favicon.ico
  logo: assets/logo.svg

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search:
      lang: es
      separator: '[\s\-,:!=\[\]()"/]+'
  - mermaid2:
      arguments:
        theme: |
          dark ? 'dark' : 'default'
        securityLevel: sandbox
      javascript: https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

# ---------------------------------------------------------------------------
# Extensiones
# ---------------------------------------------------------------------------
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
      linenums: true
  - meta
  - toc:
      permalink: true
      permalink_title: Enlace permanente a esta sección
  - tables
  - footnotes
  - def_list
  - abbr
  - md_in_html
  - sane_lists

  # Extensiones PyMdown (Material)
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: platform
      repo: users-service
  - pymdownx.mark
  - pymdownx.saneheaders
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ---------------------------------------------------------------------------
# Navegación — coincide con la estructura del directorio docs/
# ---------------------------------------------------------------------------
nav:
  - Inicio: index.md

  - Arquitectura:
      - Visión General: architecture/overview.md
      - Contexto del Sistema: architecture/context.md
      - Vista de Contenedores: architecture/containers.md
      - Vista de Componentes: architecture/components.md
      - Vista de Despliegue: architecture/deployment-view.md
      - Arquitectura de Seguridad: architecture/security.md
      - Stack Tecnológico: architecture/technology-stack.md

  - Referencia de API:
      - API de Usuarios: api/users-api.md
      - Eventos: api/events.md
      - Variables y Configuración: api/variables.md

  - Runbooks:
      - Reiniciar Servicio: runbooks/restart-service.md
      - Despliegue: runbooks/deployment.md
      - Respuesta a Incidentes: runbooks/incident-response.md
      - Rollback: runbooks/rollback.md
      - Operaciones: runbooks/operations.md

  - Onboarding:
      - Guía para Desarrolladores: onboarding/developer-guide.md
      - Desarrollo Local: onboarding/local-development.md
      - Cómo Depurar: onboarding/how-to-debug.md
      - Pruebas: onboarding/testing.md

  - Decisiones de Arquitectura:
      - ADR-001 — PostgreSQL sobre MongoDB: adr/ADR-001.md
      - ADR-002 — Validación JWT en Gateway: adr/ADR-002.md
      - ADR-003 — Sincronización de Usuarios por Eventos: adr/ADR-003.md

  - Decisiones y Estándares:
      - Estándares de Código: decisions/coding-standards.md
      - Estrategia de Ramas: decisions/branching.md
      - Versionado: decisions/versioning.md
      - Guías de Seguridad: decisions/security-guidelines.md
      - Observabilidad: decisions/observability.md
      - Dependencias: decisions/dependencies.md
      - Propiedad: decisions/ownership.md
      - Monitoreo: decisions/monitoring.md
      - Hoja de Ruta: decisions/roadmap.md
      - Integraciones Futuras: decisions/future-integrations.md
      - Riesgos: decisions/risks.md
      - Limitaciones Conocidas: decisions/known-limitations.md
      - Glosario: decisions/glossary.md

# ---------------------------------------------------------------------------
# Configuración extra
# ---------------------------------------------------------------------------
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/microsoft
      link: https://dev.azure.com/platform/
      name: Azure DevOps
